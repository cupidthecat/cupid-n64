name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        ipo: ['ON', 'OFF']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Vulkan
        if: runner.os == 'Linux'
        run: bash .github/scripts/setup-vulkan.sh
      - name: Set up Linux desktop
        if: runner.os == 'Linux' && matrix.ipo == 'ON'
        run: >-
          sudo apt-get install --yes libgtk-3-dev libpulse-dev libasound2-dev
          libudev-dev libdbus-1-dev xvfb pulseaudio pulseaudio-utils
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCUPID_INTERPROCEDURAL_OPTIMIZATION=${{ matrix.ipo }}
          -DCUPID_DESKTOP=${{ (runner.os == 'Windows' || matrix.ipo == 'ON') && 'ON' || 'OFF' }}
          -DCUPID_REQUIRE_HARDWARE_RENDERER_TESTS=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --parallel 2
      - name: Build Windows
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel 2 -- /p:CL_MP=true /p:CL_MPCount=2
      - name: Test
        if: runner.os != 'Linux' || matrix.ipo != 'ON'
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2
      - name: Test Linux desktop
        if: runner.os == 'Linux' && matrix.ipo == 'ON'
        env:
          SDL_AUDIODRIVER: dummy
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure --parallel 2
      - name: Test Linux playback
        if: runner.os == 'Linux' && matrix.ipo == 'ON'
        run: python3 .github/scripts/test-linux-audio.py build/linux_frontend_tests
      - name: Upload Windows frontend
        if: runner.os == 'Windows' && matrix.ipo == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: cupid-n64-windows
          path: build/Release/cupid-n64.exe
          if-no-files-found: error
      - name: Upload Linux frontend
        if: runner.os == 'Linux' && matrix.ipo == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: cupid-n64-linux
          path: build/cupid-n64
          if-no-files-found: error

  windows-clang:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows with Clang
        run: >-
          cmake -S . -B build -A x64 -T ClangCL
          -DCUPID_INTERPROCEDURAL_OPTIMIZATION=ON
          -DCUPID_DESKTOP=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2
      - name: Upload Windows Clang frontend
        uses: actions/upload-artifact@v4
        with:
          name: cupid-n64-windows-clang
          path: build/Release/cupid-n64.exe
          if-no-files-found: error

  software-video:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure without hardware rendering
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCUPID_HARDWARE_RENDERER=OFF
      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --parallel 2
      - name: Build Windows
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel 2 -- /p:CL_MP=true /p:CL_MPCount=2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2

  arm64:
    strategy:
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCUPID_HARDWARE_RENDERER=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2

  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Vulkan
        run: bash .github/scripts/setup-vulkan.sh
      - name: Check formatting
        run: find src tests -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Configure with sanitizers
        run: >-
          cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS_DEBUG="-O1 -g"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          -DCUPID_REQUIRE_HARDWARE_RENDERER_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --parallel 2
