name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        ipo: ['ON', 'OFF']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Vulkan
        if: runner.os == 'Linux'
        run: bash .github/scripts/setup-vulkan.sh
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCUPID_INTERPROCEDURAL_OPTIMIZATION=${{ matrix.ipo }}
          -DCUPID_REQUIRE_HARDWARE_RENDERER_TESTS=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows frontend
        if: runner.os == 'Windows' && matrix.ipo == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: cupid-n64-windows
          path: build/Release/cupid-n64.exe
          if-no-files-found: error

  software-video:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure without hardware rendering
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCUPID_HARDWARE_RENDERER=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Vulkan
        run: bash .github/scripts/setup-vulkan.sh
      - name: Check formatting
        run: find src tests -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Configure with sanitizers
        run: >-
          cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCUPID_REQUIRE_HARDWARE_RENDERER_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
