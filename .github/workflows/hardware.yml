name: Hardware validation

on:
  push:
    branches: [main, feature/n64-hardware-accuracy]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install formatter
        run: |
          python3 -m venv .work/format
          .work/format/bin/python -m pip install clang-format==22.1.0
      - name: Run local validation entry point
        run: >-
          python3 tools/ci/validate.py --build-dir build --compiler ${{ matrix.compiler }} --jobs 2
          --clang-format .work/format/bin/clang-format

  windows:
    name: Windows MSVC
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install formatter
        run: |
          python -m venv .work/format
          .work/format/Scripts/python.exe -m pip install clang-format==22.1.0
      - name: Run local validation entry point
        run: >-
          python tools/ci/validate.py --build-dir build --generator "Visual Studio 17 2022" --jobs 2
          --clang-format .work/format/Scripts/clang-format.exe

  accuracy:
    name: Full ROM suite and sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thelemmy/nemu64-test
          ref: 9a8b9f7d94ee2f6f57d7feed70c98c22cdc30e6c
          path: .work/nemu64-test
          persist-credentials: false
      - name: Prepare boot firmware
        env:
          N64_PIF_NTSC: ${{ secrets.N64_PIF_NTSC }}
        run: python3 tools/prepare_ci_firmware.py .work/pif.ntsc.rom
      - name: Build the complete test ROM
        working-directory: .work/nemu64-test
        run: |
          cargo build --release --locked
          cargo +stable install nust64 --version 0.4.1 --locked --root ../tools
          ../tools/bin/nust64 --elf target/mips-nintendo64-none/release/n64-systemtest
      - name: Install formatter
        run: |
          python3 -m venv .work/format
          .work/format/bin/python -m pip install clang-format==22.1.0
      - name: Run strict validation
        run: >-
          python3 tools/ci/validate.py --build-dir build --compiler clang++ --jobs 2
          --clang-format .work/format/bin/clang-format
          --rom .work/nemu64-test/target/mips-nintendo64-none/release/n64-systemtest.z64
          --pif .work/pif.ntsc.rom
      - name: Run sanitizer validation
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          python3 tools/ci/validate.py --build-dir build-sanitize --compiler clang++ --jobs 2
          --clang-format .work/format/bin/clang-format
          --config RelWithDebInfo --sanitizers
          --rom .work/nemu64-test/target/mips-nintendo64-none/release/n64-systemtest.z64
          --pif .work/pif.ntsc.rom
