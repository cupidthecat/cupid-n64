name: Hardware validation

on:
  push:
    branches: [main, feature/n64-hardware-accuracy]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install formatter
        run: |
          python3 -m venv .work/format
          .work/format/bin/python -m pip install clang-format==22.1.0
      - name: Run local validation entry point
        run: >-
          python3 tools/ci/validate.py --build-dir build --compiler ${{ matrix.compiler }} --jobs 2
          --clang-format .work/format/bin/clang-format
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.compiler }}-validation
          path: build/validation/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows MSVC
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install formatter
        run: |
          python -m venv .work/format
          .work/format/Scripts/python.exe -m pip install clang-format==22.1.0
      - name: Run local validation entry point
        run: >-
          python tools/ci/validate.py --build-dir build --generator "Visual Studio 17 2022" --jobs 2
          --clang-format .work/format/Scripts/clang-format.exe
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-validation
          path: build/validation/
          if-no-files-found: error
          retention-days: 14

  accuracy:
    name: Full ROM suite and sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thelemmy/nemu64-test
          ref: 9a8b9f7d94ee2f6f57d7feed70c98c22cdc30e6c
          path: .work/nemu64-test
          persist-credentials: false
      - name: Prepare cartridge fixtures
        run: >-
          python3 tools/ci/cartridge.py .work/nemu64-test
          --report .work/test-fixture-corrections.json
      - name: Prepare boot firmware
        env:
          N64_PIF_NTSC: ${{ secrets.N64_PIF_NTSC }}
        run: python3 tools/prepare_ci_firmware.py .work/pif.ntsc.rom
      - name: Build the default and extended test ROMs
        id: roms
        working-directory: .work/nemu64-test
        run: |
          cargo +stable install nust64 --version 0.4.1 --locked --root ../tools
          rustc --version --verbose > ../test-build-toolchain.txt
          cargo --version >> ../test-build-toolchain.txt
          ../tools/bin/nust64 --version >> ../test-build-toolchain.txt
          cargo build --release --locked --target-dir target-default
          ../tools/bin/nust64 --elf target-default/mips-nintendo64-none/release/n64-systemtest
          cargo build --release --locked --target-dir target-extended \
            --features timing,cycle,cop0hazard,poorly_understood_quirk,experimental_rdp
          ../tools/bin/nust64 --elf target-extended/mips-nintendo64-none/release/n64-systemtest
      - name: Retain cartridge build inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accuracy-test-inputs
          include-hidden-files: true
          path: |
            .work/test-build-toolchain.txt
            .work/test-fixture-corrections.json
            tests/cartridge/fixtures/
            .work/nemu64-test/LICENSE
            .work/nemu64-test/Cargo.lock
            .work/nemu64-test/Cargo.toml
            .work/nemu64-test/.cargo/config.toml
            .work/nemu64-test/rust-toolchain.toml
            .work/nemu64-test/mips-nintendo64-none.json
            .work/nemu64-test/linker.ld
            .work/nemu64-test/src/graphics/color.rs
            .work/nemu64-test/src/rdp/rdp_assembler.rs
            .work/nemu64-test/src/tests/rdp/filled_triangle.rs
            .work/nemu64-test/src/tests/rsp_timing/mod.rs
            .work/nemu64-test/target-default/mips-nintendo64-none/release/n64-systemtest
            .work/nemu64-test/target-default/mips-nintendo64-none/release/n64-systemtest.z64
            .work/nemu64-test/target-extended/mips-nintendo64-none/release/n64-systemtest
            .work/nemu64-test/target-extended/mips-nintendo64-none/release/n64-systemtest.z64
          if-no-files-found: error
          retention-days: 14
      - name: Install formatter
        id: formatter
        run: |
          python3 -m venv .work/format
          .work/format/bin/python -m pip install clang-format==22.1.0
      - name: Run strict validation
        run: >-
          python3 tools/ci/validate.py --build-dir build --compiler clang++ --jobs 2
          --clang-format .work/format/bin/clang-format
          --test-source .work/nemu64-test
          --rom .work/nemu64-test/target-default/mips-nintendo64-none/release/n64-systemtest.z64
          --extended-rom .work/nemu64-test/target-extended/mips-nintendo64-none/release/n64-systemtest.z64
          --pif .work/pif.ntsc.rom
      - name: Run sanitizer validation
        if: ${{ !cancelled() && steps.roms.outcome == 'success' && steps.formatter.outcome == 'success' }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          python3 tools/ci/validate.py --build-dir build-sanitize --compiler clang++ --jobs 2
          --clang-format .work/format/bin/clang-format
          --config RelWithDebInfo --sanitizers
          --test-source .work/nemu64-test
          --rom .work/nemu64-test/target-default/mips-nintendo64-none/release/n64-systemtest.z64
          --extended-rom .work/nemu64-test/target-extended/mips-nintendo64-none/release/n64-systemtest.z64
          --pif .work/pif.ntsc.rom
      - name: Retain both accuracy runs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accuracy-validation
          path: |
            build/validation/
            build-sanitize/validation/
          if-no-files-found: error
          retention-days: 14
